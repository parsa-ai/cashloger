<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کش لاگر</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100dvh; display: grid; place-items: center;
            font-family: system-ui, sans-serif; background: #f4f5f9; color: #1c1d22;
        }
        @media (prefers-color-scheme: dark) { body { background: #111216; color: #f2f3f7; } }
        main { text-align: center; padding: 24px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0 0 20px; opacity: .7; }
        button {
            font: inherit; border: 0; border-radius: 14px; padding: 12px 22px;
            background: #3b6ff5; color: #fff; font-weight: 600;
        }
        button:active { transform: scale(.96); }
    </style>
</head>
<body>
    <main>
        <h1>اینترنت در دسترس نیست</h1>
        <p>این صفحه هنوز روی دستگاه ذخیره نشده. یک بار با اینترنت بازش کن تا آفلاین هم کار کند.</p>
        <button onclick="location.reload()">تلاش دوباره</button>
    </main>
</body>
</html>
